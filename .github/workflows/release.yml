# Attaches the Windows DLLs to a published release. CI runs first on the
# release's commit, and the zip is made from the DLLs it built and tested.
# Windows users have no compiler; macOS and Linux build from source. Only the
# last job, which runs no build, can write to the release.
# SPDX-License-Identifier: GPL-3.0-or-later
name: release
on:
  release:
    types: [published]
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-dlls
          path: build
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          d="openport-j2534-$TAG-windows"
          mkdir -p "$d/win32" "$d/win64"
          cp build/win32/openport-j2534-32.dll build/win32/op_probe.exe "$d/win32/"
          cp build/win64/openport-j2534-64.dll build/win64/op_probe.exe "$d/win64/"
          i686-w64-mingw32-strip "$d"/win32/*
          x86_64-w64-mingw32-strip "$d"/win64/*
          cp LICENSE NOTICE "$d/"
          sed 's/$/\r/' tools/release/README-windows.txt > "$d/README.txt"
          (cd "$d" && sha256sum win32/* win64/* > SHA256SUMS.txt)
          zip -r "$d.zip" "$d"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-zip
          path: openport-j2534-*-windows.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-zip
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "openport-j2534-$TAG-windows.zip" --clobber --repo "$GITHUB_REPOSITORY"
